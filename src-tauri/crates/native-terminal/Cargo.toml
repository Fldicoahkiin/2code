[package]
name = "native-terminal"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "29"
raw-window-handle = "0.6"
pollster = "0.4"
glyphon = "0.11"
alacritty_terminal = "0.26"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder"] }
